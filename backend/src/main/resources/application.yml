spring:
  application:
    name: smart-campus-operations-hub
    
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_campus_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: 8080

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: uploads
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    full-name: ${SEED_ADMIN_FULL_NAME:System Administrator}
    email: ${SEED_ADMIN_EMAIL:admin@smartcampus.com}
    password: ${SEED_ADMIN_PASSWORD:Admin@123}
